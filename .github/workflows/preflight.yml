name: Main Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    name: Detect Affected Jobs
    runs-on: ubuntu-latest
    outputs:
      run_biome_format: ${{ steps.detect.outputs.run_biome_format }}
      run_typescript_packages: ${{ steps.detect.outputs.run_typescript_packages }}
      run_extension: ${{ steps.detect.outputs.run_extension }}
      run_docs: ${{ steps.detect.outputs.run_docs }}
      run_landing: ${{ steps.detect.outputs.run_landing }}
      run_demo: ${{ steps.detect.outputs.run_demo }}
      run_playground: ${{ steps.detect.outputs.run_playground }}
      run_desktop_macos: ${{ steps.detect.outputs.run_desktop_macos }}
      run_python_sdk: ${{ steps.detect.outputs.run_python_sdk }}
      run_rust_sdk: ${{ steps.detect.outputs.run_rust_sdk }}
      run_go_sdk: ${{ steps.detect.outputs.run_go_sdk }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Detect affected preflight jobs
        id: detect
        run: bun run scripts/preflight.ts --list --since "${{ github.event.pull_request.base.sha }}" --github-output "$GITHUB_OUTPUT"

  biome-format:
    name: Biome Format Check
    needs: detect
    if: needs.detect.outputs.run_biome_format == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript formatting
        run: bun run format:check

  typescript-packages:
    name: TypeScript Packages
    needs: detect
    if: needs.detect.outputs.run_typescript_packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable TypeScript packages
        run: bun run build

      - name: Run TypeScript package tests
        run: bun run test

  extension:
    name: Chrome Extension
    needs: detect
    if: needs.detect.outputs.run_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck extension
        working-directory: apps/extension
        run: bun run typecheck

      - name: Build extension
        working-directory: apps/extension
        run: bun run build

  docs:
    name: Docs
    needs: detect
    if: needs.detect.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        working-directory: website/docs
        run: bun install --frozen-lockfile

      - name: Check generated docs content
        working-directory: website/docs
        run: bun run check:content

      - name: Build docs site
        working-directory: website/docs
        run: bun run build

  landing:
    name: Landing Site
    needs: detect
    if: needs.detect.outputs.run_landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install landing dependencies
        working-directory: website/landing
        run: bun install --frozen-lockfile

      - name: Build landing site
        working-directory: website/landing
        run: bun run build

  demo:
    name: Demo Site
    needs: detect
    if: needs.detect.outputs.run_demo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript packages
        run: bun run build

      - name: Build demo site
        working-directory: website/demo
        run: bun run build

  playground:
    name: Playground
    needs: detect
    if: needs.detect.outputs.run_playground == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build TypeScript packages
        run: bun run build

      - name: Build playground
        working-directory: website/playground
        run: bun run build

  desktop-macos:
    name: Desktop macOS Smoke Build
    needs: detect
    if: needs.detect.outputs.run_desktop_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck desktop frontend
        working-directory: apps/desktop
        run: bun run typecheck

      - name: Build desktop app bundle without signing
        working-directory: apps/desktop
        run: bunx tauri build --no-sign --bundles app

  python-sdk:
    name: Python SDK
    needs: detect
    if: needs.detect.outputs.run_python_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python SDK test dependencies
        run: python -m pip install -e "packages/python/slop-ai[all]"

      - name: Run Python SDK tests
        run: python -m pytest packages/python/slop-ai/tests

  rust-sdk:
    name: Rust SDK
    needs: detect
    if: needs.detect.outputs.run_rust_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust SDK tests
        working-directory: packages/rust/slop-ai
        run: cargo test

  go-sdk:
    name: Go SDK
    needs: detect
    if: needs.detect.outputs.run_go_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/go/slop-ai/go.mod

      - name: Run Go SDK tests
        working-directory: packages/go/slop-ai
        run: go test ./...
